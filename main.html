<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <style> body { font-family: 'Geist Sans', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="navbar bg-white border-b px-4 lg:px-12 py-4">
        <div class="flex-1">
            <img src="assets/github-logo.png" alt="Logo" class="w-8 mr-2">
            <a class="text-xl font-bold">Issues Tracker</a>
        </div>
        <div class="flex-none gap-2">
            <div class="join">
                <input id="searchInput" type="text" placeholder="Search issues..." class="input input-bordered join-item w-40 lg:w-80" />
                <button onclick="handleSearch()" class="btn btn-primary join-item bg-indigo-600 border-none">Search</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 lg:p-12">
        <section class="toggle-section bg-white flex  rounded-lg border shadow-sm w-full lg:w-auto sm:space-y-2 mb-4">
            <div class="flex  space-x-2 flex-col space-y-2 sm:flex-row   bg-gray-50 p-1 rounded-lg ">
            <button onclick="filterIssues('all', this)" 
                class="tab-btn px-8 py-2 rounded-md text-sm font-semibold transition-all bg-[#5D00FF] text-white shadow-md">
                All
            </button>
            <button onclick="filterIssues('open', this)" class="tab-btn border border-gray-300 px-8 py-2 rounded-md text-sm font-semibold text-gray-500 hover:bg-white hover:text-[#5D00FF] transition-all">
                Open
            </button>
            <button onclick="filterIssues('closed', this)" 
                class="tab-btn px-8 py-2 rounded-md text-sm border border-gray-300 font-semibold text-gray-500 hover:bg-white hover:text-[#5D00FF] transition-all">
                Closed
            </button>
        </div>
        </section>
        <section>
            <div class="flex   items-center flex-col space-y-2 sm:flex-row gap-6 bg-white p-3 rounded-lg justify-between border shadow-sm w-full lg:w-auto mb-4">
                <div class="flex items-center gap-2">
                    <img src="assets/Aperture.png" class="w-5" alt="Icon">
                    <span id="issueCount" class="font-bold">0 Issues</span>
                </div>
                <div class="flex gap-4 text-xs font-semibold">
                    <span class="text-green-600 flex items-center gap-1">● Open</span>
                    <span class="text-purple-600 flex items-center gap-1">● Closed</span>
                </div>
                </div>
        </section>
        <section class="loader-section">
            <div id="loader" class="hidden flex justify-center py-20">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
        </section>

        <section class="issue-section">
            <div id="issueContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
        </section>
    </main>
    <dialog id="issueModal" class="modal">
        <div class="modal-box w-11/12 max-w-3xl">
            <div id="modalContent"></div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-primary bg-indigo-600 border-none">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
